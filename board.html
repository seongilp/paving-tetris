<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f22">
<meta name="description" content="보도블록 자랑하기 게시판 — 예쁘게 깐 바닥 순위">
<title>보도블록 — 자랑하기 게시판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app board-page">
  <header class="head">
    <div class="titles">
      <h1>자랑하기 게시판</h1>
      <p>예쁘게 깐 바닥들</p>
    </div>
    <a class="ghost-btn link-btn" href="./">게임으로</a>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="top" role="tab" aria-selected="true">상위 50</button>
    <button type="button" class="tab" data-tab="recent" role="tab" aria-selected="false">최근 20</button>
  </nav>

  <p id="board-msg" class="board-msg" aria-live="polite">불러오는 중…</p>
  <ol id="list" class="entries"></ol>
</main>

<div id="lightbox" class="overlay lightbox" hidden>
  <div class="lightbox-card" role="dialog" aria-modal="true" aria-label="바닥 크게 보기">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="닫기">✕</button>
    <canvas id="lightbox-canvas" class="lightbox-canvas"></canvas>
    <div class="lightbox-info">
      <div class="entry-top">
        <b id="lightbox-name" class="name"></b>
        <span id="lightbox-score" class="score"></span>
      </div>
      <div id="lightbox-badges" class="badges"></div>
      <div class="lightbox-actions">
        <div id="lightbox-meta" class="meta"></div>
        <button type="button" id="lightbox-like" class="like-btn" aria-pressed="false">
          <span class="like-heart" aria-hidden="true">♥</span>
          <span id="lightbox-like-count">0</span>
        </button>
      </div>

      <div class="comments">
        <p id="comments-msg" class="board-msg" aria-live="polite"></p>
        <ol id="comment-list" class="comment-list"></ol>
        <form id="comment-form" class="comment-form" autocomplete="off">
          <div class="comment-row">
            <input id="comment-name" type="text" minlength="1" maxlength="12" placeholder="이름" required>
            <input id="comment-text" type="text" minlength="1" maxlength="200" placeholder="댓글 달기" required>
          </div>
          <button type="submit" id="comment-submit" class="ghost-btn comment-submit">등록</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script type="module" src="board.js"></script>
</body>
</html>
